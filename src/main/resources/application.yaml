spring:
  application:
    name: helix-crm
  profiles:
    active: ${ACTIVE_SPRING_PROFILE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

logging:
  level:
    org.springframework.modulith: DEBUG

helix:
  company:
    name: Helix GPO
    legal-name: Helix GPO UG (haftungsbeschränkt) & Co. KG
    vat-id: ${HELIX_VAT_ID:DE1234567890}
    address:
      street: Erftstraße
      house-number: "50"
      postal-code: "41460"
      city: Neuss
      country-code: DE
    email: helix.gpo@gmail.com
    iban: ${HELIX_IBAN:DE43300700240795085000}
    bic: ${HELIX_BIC:DEUTDEDBDUE}
  security:
    public-ip-allowlist: ${PUBLIC_IP_ALLOWLIST}
    cognito:
      client-id: ${COGNITO_CLIENT_ID}
  s3:
    bucket: ${S3_BUCKET_NAME}
    region: eu-central-1
  notification:
    sender-email: ${NOTIFICATION_SENDER_EMAIL:noreply@helix-gpo.com}
    sender-name: ${NOTIFICATION_SENDER_NAME:Helix GPO}
    reply-to-email: ${NOTIFICATION_REPLY_TO_EMAIL:helix.gpo@gmail.com}
    logo-url: ${NOTIFICATION_LOGO_URL:http://localhost:4200/public/images/logo-no-bg.svg}
    region: eu-central-1
  website:
    base-url: ${WEBSITE_BASE_URL:http://localhost:4201}
